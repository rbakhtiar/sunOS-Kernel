
name: sunOS Kernel Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc \
            binutils \
            make \
            gnu-efi \
            qemu-system-x86 \
            ovmf \
            mtools \
            nasm

      - name: Check build tools
        run: make check-tools

      - name: Build sunOS
        run: make all

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sunOS-build
          path: build/
